<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <title>Maç Simülasyonu</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>



        .tema-butonu {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .mac-alani {
            margin-top: 80px;
        }

        select {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
        }

        .simule-butonu {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .geri {
            display: block;
            width: fit-content;
            margin: 30px auto 0 auto;
            padding: 12px 25px;
            background-color: white;
            color: black;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <button class="tema-butonu" onclick="temaDegistir()">
        🌙 Koyu / ☀️ Açık
    </button>


    <div class="mac-alani">

        <h1>⚽ MAÇ SİMÜLASYONU</h1>


        <form method="POST">

            <p>Ev Sahibi Takım</p>

            <select name="takim1">

                {% for takim in takimlar %}

                    <option value="{{ takim }}">
                        {{ takim }}
                    </option>

                {% endfor %}

            </select>


            <p>Deplasman Takımı</p>

            <select name="takim2">

                {% for takim in takimlar %}

                    <option value="{{ takim }}">
                        {{ takim }}
                    </option>

                {% endfor %}

            </select>


            <br>


            <button class="simule-butonu" type="submit">
                ⚽ MAÇI SİMÜLE ET
            </button>

        </form>


        {% if sonuc %}

            <h2>MAÇ SONUCU</h2>

            <h3>{{ sonuc }}</h3>

        {% endif %}

    </div>


    <script>

        function temaDegistir() {

            document.body.classList.toggle("acik-tema");

        }

    </script>

    </div>


    <a href="/" class="geri">
        🏠 ANA SAYFA
    </a>



</body>

</html>
