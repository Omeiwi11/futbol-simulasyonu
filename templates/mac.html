<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maç Simülasyonu</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>

        body {

            min-height: 100vh;

            box-sizing: border-box;

            color: white;

        }


        .tema-butonu {

            position: absolute;

            top: 20px;

            right: 20px;

            padding: 10px 15px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            z-index: 10;

        }


        .mac-alani {

            min-height: 90vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

        }


        .mac-alani h1 {

            margin-bottom: 30px;

            color: white;

            font-size: 36px;

        }


        .mac-alani p {

            color: white;

            font-weight: bold;

            font-size: 18px;

        }


        select {

            padding: 12px;

            font-size: 16px;

            margin: 10px;

            border-radius: 8px;

            min-width: 220px;

        }


        .simule-butonu {

            margin-top: 20px;

            padding: 15px 30px;

            font-size: 20px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            color: black;

        }


        .mac-alani h2,
        .mac-alani h3 {

            color: white;

        }


        .geri {

            display: block;

            width: fit-content;

            margin: -40px auto 20px auto;

            padding: 12px 25px;

            background-color: white;

            color: black;

            text-decoration: none;

            border-radius: 10px;

            font-weight: bold;

        }


        .geri:hover {

            background-color: #ddd;

        }


        body.acik-tema {

            color: black;

        }


        body.acik-tema .mac-alani h1,
        body.acik-tema .mac-alani p,
        body.acik-tema .mac-alani h2,
        body.acik-tema .mac-alani h3 {

            color: black;

        }


        @media (max-width: 600px) {

            .mac-alani h1 {

                font-size: 28px;

            }

            select {

                min-width: 200px;

            }

            .simule-butonu {

                font-size: 18px;

                padding: 13px 25px;

            }

        }

    </style>

</head>


<body>


    <button
        class="tema-butonu"
        onclick="temaDegistir()"
    >

        🌙 Koyu / ☀️ Açık

    </button>


    <div class="mac-alani">


        <h1>

            ⚽ MAÇ SİMÜLASYONU

        </h1>


        <form method="POST">


            <p>

                Ev Sahibi Takım

            </p>


            <select name="takim1">

                {% for takim in takimlar %}

                    <option value="{{ takim }}">

                        {{ takim }}

                    </option>

                {% endfor %}

            </select>


            <p>

                Deplasman Takımı

            </p>


            <select name="takim2">

                {% for takim in takimlar %}

                    <option value="{{ takim }}">

                        {{ takim }}

                    </option>

                {% endfor %}

            </select>


            <br>


            <button
                class="simule-butonu"
                type="submit"
            >

                ⚽ MAÇI SİMÜLE ET

            </button>


        </form>


        {% if sonuc %}

            <h2>

                MAÇ SONUCU

            </h2>

            <h3>

                {{ sonuc }}

            </h3>

        {% endif %}


    </div>


    <a href="/" class="geri">

        🏠 ANA SAYFA

    </a>


    <script>

        function temaDegistir() {

            document.body.classList.toggle("acik-tema");

        }

    </script>


</body>

</html>
