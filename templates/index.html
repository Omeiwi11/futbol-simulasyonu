<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <title>Futbol Simülasyonu</title>

    <style>

        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        body.acik-tema {
            background-color: white;
            color: black;
        }

        .tema-butonu {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .menu-butonu {
            margin-top: 50px;
        }

        .menu-butonu button {
            font-size: 24px;
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .fikstur-butonu {
            margin-top: 20px;
        }

        .fikstur-butonu button {
            font-size: 24px;
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <button class="tema-butonu" onclick="temaDegistir()">
        🌙 Koyu / ☀️ Açık
    </button>


    <h1>⚽ FUTBOL SİMÜLASYONU</h1>


    <div class="menu-butonu">

        <a href="/mac">
            <button>⚽ MAÇI SİMÜLE ET</button>
        </a>

    </div>


    <div class="fikstur-butonu">

        <a href="/fikstur">
            <button>📅 FİKSTÜR</button>
        </a>

    </div>


    <script>

        function temaDegistir() {

            document.body.classList.toggle("acik-tema");

        }

    </script>


</body>

</html>
