<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Süper Ligin Kalbi</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            min-height: 100vh;
            box-sizing: border-box;
        }

        .tema-butonu {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
        }

        .ana-icerik {
            min-height: 90vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .ana-icerik h1 {
            margin-bottom: 35px;
        }

        .menu-butonu,
        .fikstur-butonu,
        .puan-butonu {
            margin-top: 15px;
        }

        .menu-butonu button,
        .fikstur-butonu button,
        .puan-butonu button {

            font-size: 24px;

            padding: 15px 40px;

            border: none;

            border-radius: 12px;

            cursor: pointer;
        }

    </style>

</head>


<body>

    <button
        class="tema-butonu"
        onclick="temaDegistir()"
    >
        🌙 Koyu / ☀️ Açık
    </button>


    <div class="ana-icerik">

        <h1>
            ⚽ Süper Ligin Kalbi
        </h1>


        <div class="menu-butonu">

            <a href="/mac">
                <button>
                    ⚽ MAÇI SİMÜLE ET
                </button>
            </a>

        </div>


        <div class="fikstur-butonu">

            <a href="/fikstur">
                <button>
                    📅 FİKSTÜR
                </button>
            </a>

        </div>


        <div class="puan-butonu">

            <a href="/puan-durumu">
                <button>
                    🏆 PUAN DURUMU
                </button>
            </a>

        </div>

    </div>


    <script>

        function temaDegistir() {

            document.body.classList.toggle("acik-tema");

        }

    </script>


</body>

</html>
