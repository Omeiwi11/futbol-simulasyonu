<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <title>Futbol Simülasyonu</title>

    <style>

        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        body.acik-tema {
            background-color: white;
            color: black;
        }

        .tema-butonu {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <button class="tema-butonu" onclick="temaDegistir()">
        🌙 Koyu / ☀️ Açık
    </button>


    <h1>⚽ FUTBOL SİMÜLASYONU</h1>


    <form method="POST">

        <p>Ev Sahibi Takım</p>

        <select name="takim1">

            {% for takim in takimlar %}
                <option value="{{ takim }}">{{ takim }}</option>
            {% endfor %}

        </select>


        <p>Deplasman Takımı</p>

        <select name="takim2">

            {% for takim in takimlar %}
                <option value="{{ takim }}">{{ takim }}</option>
            {% endfor %}

        </select>


        <br><br>


        <button type="submit">
            MAÇI SİMÜLE ET
        </button>

    </form>


    {% if sonuc %}

        <h2>MAÇ SONUCU</h2>

        <h3>{{ sonuc }}</h3>

    {% endif %}


    <script>

        function temaDegistir() {

            document.body.classList.toggle("acik-tema");

        }

    </script>


</body>

</html>
